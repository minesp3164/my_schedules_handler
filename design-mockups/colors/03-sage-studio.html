<!doctype html><html lang="ko" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sage Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px ui-sans-serif,system-ui,sans-serif;transition:.25s}.app{max-width:430px;min-height:100vh;margin:auto;padding:22px 20px;background:var(--bg)}:root{--bg:#f6f8f3;--card:#ffffff;--ink:#1f3129;--muted:#78867d;--line:#dce6dc;--accent:#27725f;--accent-ink:#f7fffa;--soft:#dcefe6;--yellow:#e5b956}[data-theme=dark]{--bg:#17231f;--card:#21312b;--ink:#f0f8f2;--muted:#afbeb5;--line:#3a5146;--accent:#73c8a6;--accent-ink:#153c30;--soft:#29473c;--yellow:#f3c96b}.nav{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;letter-spacing:-1px}.logo span{color:var(--accent)}button{font:inherit}.mode{border:1px solid var(--line);color:var(--ink);background:var(--card);border-radius:9px;padding:7px 10px}.date{margin-top:42px;color:var(--muted);font-size:13px}.title{font-size:33px;letter-spacing:-2px;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:24px}.tile{padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--line)}.tile strong{display:block;font-size:26px;margin-top:8px}.wide{margin-top:11px;padding:18px;border-radius:14px;background:var(--soft);color:var(--ink)}.wide .row{display:flex;justify-content:space-between;align-items:center}.wide button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:10px 14px;font-weight:800}.list{margin-top:25px}.item{display:flex;align-items:center;gap:11px;padding:14px 0;border-bottom:1px solid var(--line)}.square{width:21px;height:21px;border-radius:6px;border:2px solid var(--accent)}.square.done{background:var(--accent);position:relative}.square.done:after{content:'✓';color:var(--accent-ink);font-size:13px;position:absolute;left:3px;top:0}.item b{flex:1}.p{color:var(--yellow);font-weight:800}.swatches{margin-top:24px;display:flex;gap:8px}.swatches i{width:24px;height:24px;border-radius:6px}.swatches i:nth-child(1){background:#27725f}.swatches i:nth-child(2){background:#e5b956}.swatches i:nth-child(3){background:#1f3129}</style></head><body><main class="app"><header class="nav"><div class="logo">focus<span>•</span>log</div><button class="mode" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light'">라이트 / 다크</button></header><p class="date">2026년 9월 12일 · 금요일</p><h1 class="title">오늘의 흐름</h1><div class="grid"><section class="tile"><small style="color:var(--muted)">이번 주</small><strong>185점</strong><span style="color:var(--accent)">↗ 좋은 흐름</span></section><section class="tile"><small style="color:var(--muted)">집중 시간</small><strong>50분</strong><span style="color:var(--muted)">목표 75분</span></section></div><section class="wide"><div class="row"><div><b>다음 집중</b><p style="margin:5px 0 0;color:var(--muted)">작게 시작해도 충분해요.</p></div><button>25:00</button></div></section><section class="list"><b>오늘의 할 일</b><div class="item"><i class="square done"></i><b>알고리즘 1문제</b><span class="p">+15</span></div><div class="item"><i class="square"></i><b>이력서 한 문장</b><span class="p">+20</span></div></section><div class="swatches"><i></i><i></i><i></i><span style="color:var(--muted);padding:3px">Sage Studio</span></div></main></body></html>
