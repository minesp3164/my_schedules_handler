<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rose Graphite — 색상 목업</title>
  <style>
    * {box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--page);color:var(--ink);font-family:ui-serif, Georgia, "Noto Serif KR", serif;transition:.25s}:root{--page:#f8e9ec;--bg:#fffafa;--card:#fff;--ink:#35262c;--muted:#8c747c;--line:#f0dce2;--accent:#b94d70;--accent-ink:#fff;--soft:#ffe4eb;--gold:#c99045;--shadow:0 24px 55px #96526930}[data-theme="dark"]{--page:#171216;--bg:#231a1f;--card:#302329;--ink:#fff5f7;--muted:#c9aeb7;--line:#513841;--accent:#ff9bb8;--accent-ink:#38202a;--soft:#4c2d39;--gold:#ffd18a;--shadow:0 24px 55px #0009}.phone{width:min(390px,100vw);min-height:820px;padding:25px 20px 35px;background:var(--bg);box-shadow:var(--shadow)}.nav{display:flex;justify-content:space-between;align-items:center;font-family:ui-sans-serif,system-ui}.brand{font-size:13px;font-weight:900;letter-spacing:.16em;color:var(--accent)}.switch{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:8px 11px;cursor:pointer}.date{margin:27px 0 6px;color:var(--muted);font-size:13px}.title{margin:0;font-size:34px;line-height:1.16;letter-spacing:-.09em}.title em{color:var(--accent);font-style:normal}.quote{margin:17px 0 25px;padding-left:13px;border-left:3px solid var(--gold);font-size:14px;line-height:1.65;color:var(--muted)}.calendar{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:17px;font-family:ui-sans-serif,system-ui}.cal-top{display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:13px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.days span{height:32px;display:grid;place-items:center;border-radius:50%;font-size:12px;color:var(--muted)}.days .done{background:var(--soft);color:var(--accent);font-weight:800}.days .today{background:var(--accent);color:var(--accent-ink);font-weight:900}.label{font-family:ui-sans-serif,system-ui;margin:25px 1px 11px;font-size:13px;font-weight:900;color:var(--muted);letter-spacing:.04em}.priority{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:15px;font-family:ui-sans-serif,system-ui}.check{width:20px;height:20px;border-radius:7px;border:2px solid var(--accent)}.priority b{font-size:14px}.priority small{display:block;color:var(--muted);margin-top:3px;font-size:11px}.timer{margin-top:15px;padding:19px;background:linear-gradient(130deg,var(--soft),var(--card));border-radius:20px;border:1px solid var(--line);text-align:center;font-family:ui-sans-serif,system-ui}.timer small{color:var(--muted);font-weight:800}.timer strong{display:block;font-family:ui-monospace,monospace;font-size:39px;letter-spacing:-.08em;margin:7px 0 14px}.timer button{border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);padding:11px 33px;font-weight:900}.footer{font-family:ui-sans-serif,system-ui;text-align:center;color:var(--gold);font-size:12px;margin-top:19px;font-weight:800}
  </style>
</head>
<body><main class="phone"><div class="nav"><span class="brand">MOMENTUM</span><button class="switch" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light'">라이트 / 다크</button></div><p class="date">2026년 9월 12일 · 금요일</p><h1 class="title">오늘의 시간을<br><em>아끼는</em> 연습.</h1><p class="quote">“완벽한 하루보다, 다시 시작하는 하루가 더 오래 간다.”</p><section class="calendar"><div class="cal-top"><span>이번 주의 흐름</span><span style="color:var(--gold)">5일 연속</span></div><div class="days"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span><span class="done">8</span><span class="done">9</span><span class="done">10</span><span class="done">11</span><span class="today">12</span><span>13</span><span>14</span></div></section><div class="label">가장 중요한 한 가지</div><section class="priority"><i class="check"></i><div><b>지원서 프로젝트 설명 완성하기</b><small>오늘 13:00 전 · 40분 예상</small></div></section><section class="timer"><small>FOCUS SESSION</small><strong>25:00</strong><button>지금 시작하기</button></section><div class="footer">오늘의 보상까지 29분 남았어요 ✦</div></main></body>
</html>
