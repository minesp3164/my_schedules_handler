<!doctype html><html lang="ko" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Warm Paper</title><style>
*{box-sizing:border-box}html{background:#e8e3da}body{margin:0;font:15px ui-rounded,"SF Pro Rounded",system-ui,sans-serif;background:var(--bg);color:var(--ink);transition:.25s}.app{max-width:430px;min-height:100vh;margin:auto;padding:24px 20px 34px;background:var(--bg)}:root{--bg:#fbf8f1;--card:#fffdf8;--ink:#283128;--muted:#72766a;--line:#e5dfd3;--accent:#e67148;--accent-ink:#fff8f2;--soft:#fbe3d8;--green:#52795e}[data-theme=dark]{--bg:#202521;--card:#2a302a;--ink:#f8f2e9;--muted:#c2c4ba;--line:#414a42;--accent:#ff9873;--accent-ink:#382116;--soft:#463127;--green:#a6d2a9}.top{display:flex;justify-content:space-between;align-items:center}.mark{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:var(--soft);color:var(--accent);font-size:20px}.mode{border:1px solid var(--line);border-radius:20px;padding:9px 12px;background:var(--card);color:var(--ink);font:inherit}.eyebrow{margin-top:34px;color:var(--accent);font-weight:800;letter-spacing:1px;font-size:11px}.hero{font-size:32px;line-height:1.15;letter-spacing:-1.7px;margin:8px 0}.muted{color:var(--muted);line-height:1.55}.goal{margin-top:24px;padding:18px;border:1px solid var(--line);border-radius:23px;background:var(--card)}.goal-head{display:flex;justify-content:space-between;font-weight:800}.bar{height:9px;margin:16px 0 10px;border-radius:8px;background:var(--line);overflow:hidden}.bar i{display:block;width:62%;height:100%;border-radius:inherit;background:var(--accent)}.task{display:flex;align-items:center;gap:12px;margin-top:12px;padding:14px 0;border-top:1px solid var(--line)}.check{width:24px;height:24px;border:2px solid var(--accent);border-radius:50%;display:grid;place-items:center;color:var(--accent)}.check.done{background:var(--green);border-color:var(--green);color:#fff}.task div{flex:1}.task b{display:block}.points{color:var(--accent);font-weight:800}.cta{width:100%;border:0;border-radius:17px;background:var(--accent);color:var(--accent-ink);padding:16px;margin-top:22px;font:800 15px inherit}.palette{display:flex;gap:7px;margin-top:27px}.palette i{width:26px;height:26px;border-radius:50%;border:2px solid var(--bg)}.palette i:nth-child(1){background:#fbf8f1}.palette i:nth-child(2){background:#e67148}.palette i:nth-child(3){background:#52795e}.palette i:nth-child(4){background:#283128}</style></head><body><main class="app"><header class="top"><span class="mark">✦</span><button class="mode" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light'">☼ / ☾</button></header><p class="eyebrow">WARM PAPER · 01</p><h1 class="hero">부드럽게,<br>오늘을 시작해요.</h1><p class="muted">종이 같은 따뜻한 배경과 코랄 포인트. 낮에 오래 봐도 편안한 방향이에요.</p><section class="goal"><div class="goal-head"><span>오늘의 작은 목표</span><span>62점</span></div><div class="bar"><i></i></div><p class="muted">100점까지 38점 남았어요</p><div class="task"><span class="check done">✓</span><div><b>알고리즘 1문제</b><small class="muted">오늘의 첫 기록</small></div><span class="points">+15</span></div><div class="task"><span class="check">○</span><div><b>25분 집중</b><small class="muted">지금 바로 시작</small></div><span class="points">+10</span></div></section><button class="cta">25분 집중 시작</button><div class="palette"><i></i><i></i><i></i><i></i><span class="muted">Warm Paper</span></div></main></body></html>
