p:6px;margin-top:28px}.dots i{width:25px;height:25px;border-radius:50%}.dots i:nth-child(1){background:#7964dc}.dots i:nth-child(2){background:#f6b1a0}.dots i:nth-child(3){background:#27233c}</style></head><body><main class="app"><header class="row"><span class="avatar">✦</span><button class="mode" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light'">☼</button></header><p class="label">LAVENDER MIST · 02</p><h1 class="title">차분한 리듬으로<br>꾸준히 쌓아가요.</h1><p style="color:var(--muted);line-height:1.55">은은한 라벤더와 맑은 여백. 기존 분위기는 살리되 명도를 크게 올린 안이에요.</p><section class="card"><div class="row"><b>오늘의 보상 궤도</b><span style="color:var(--accent);font-weight:800">68%</span></div><div class="ring"><div>68<small style="font-size:11px;color:var(--muted)"> / 100점</small></div></div><div class="chips"><span class="chip">알고리즘 ✓</span><span class="chip">포트폴리오</span></div></section><section class="focus"><b>다음 집중 세션</b><button>시작 →</button><p style="margin:8px 0 0;font-size:13px">25분이면 오늘 목표에 가까워져요.</p></section><div class="dots"><i></i><i></i><i></i><span style="color:var(--muted);padding:4px">Lavender Mist</span></div></main></body></html>
