<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Skyline — 색상 목업</title>
  <style>
    * { box-sizing: border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--page); color:var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; transition:.25s; }
    :root { --page:#e8f3ff; --bg:#f5faff; --card:#fff; --ink:#173052; --muted:#69809d; --line:#d8e7f5; --accent:#2479cc; --accent-ink:#fff; --soft:#dceeff; --aqua:#31b9bd; --shadow:0 22px 55px #7399bd33; }
    [data-theme="dark"] { --page:#0b1727; --bg:#102238; --card:#172d47; --ink:#edf6ff; --muted:#a3b9d2; --line:#294866; --accent:#71b7ff; --accent-ink:#102238; --soft:#193d61; --aqua:#71ddd7; --shadow:0 24px 60px #0008; }
    .phone { width:min(390px,100vw); min-height:820px; padding:23px 20px 32px; background:var(--bg); box-shadow:var(--shadow); overflow:hidden; }
    .top { display:flex; justify-content:space-between; align-items:center; } .eyebrow { font-size:12px; color:var(--aqua); font-weight:800; letter-spacing:.12em; } h1 { margin:5px 0 0; font-size:27px; letter-spacing:-.06em; } .switch { border:1px solid var(--line); border-radius:99px; background:var(--card); color:var(--ink); padding:9px 12px; cursor:pointer; font-weight:750; }
    .hero { margin-top:23px; padding:21px; border-radius:25px; color:#fff; background:linear-gradient(130deg,var(--accent),var(--aqua)); position:relative; overflow:hidden; } .hero:after { content:""; position:absolute; width:210px; height:210px; right:-80px; top:-115px; border:34px solid #ffffff30; border-radius:50%; } .hero small,.hero p { opacity:.88; } .hero h2 { font-size:29px; margin:8px 0; letter-spacing:-.06em; } .hero p { margin:0; font-size:14px; } .wave { display:flex; gap:5px; align-items:end; height:38px; margin-top:19px; } .wave i { display:block; width:9px; border-radius:12px; background:#fff; } .wave i:nth-child(1){height:13px}.wave i:nth-child(2){height:25px}.wave i:nth-child(3){height:18px}.wave i:nth-child(4){height:33px}.wave i:nth-child(5){height:22px}.wave i:nth-child(6){height:37px}.wave i:nth-child(7){height:28px}.wave i:nth-child(8){height:16px}
    .stats { display:grid; grid-template-columns:repeat(3,1fr); background:var(--card); border:1px solid var(--line); border-radius:19px; margin:16px 0; } .stat { padding:15px 10px; text-align:center; border-right:1px solid var(--line); } .stat:last-child {border:0}.stat b {display:block;font-size:20px}.stat span {font-size:11px;color:var(--muted)}
    .section { display:flex; justify-content:space-between; align-items:center; margin:24px 2px 12px; } .section b { font-size:16px; } .section span { color:var(--accent); font-size:12px; font-weight:800; }.task { display:flex; gap:12px; align-items:center; padding:14px 3px; border-bottom:1px solid var(--line); }.dot {width:11px;height:11px;border:3px solid var(--accent);border-radius:50%}.task b {display:block;font-size:14px}.task small {color:var(--muted);font-size:12px}.tag {margin-left:auto;background:var(--soft);color:var(--accent);padding:5px 8px;border-radius:8px;font-size:11px;font-weight:800}
    .focus { margin-top:24px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:16px; display:flex; align-items:center; gap:13px; }.ring { width:48px;height:48px;border-radius:50%;background:conic-gradient(var(--aqua) 0 72%,var(--soft) 72%);display:grid;place-items:center; }.ring:after {content:"";width:35px;height:35px;border-radius:50%;background:var(--card)}.focus div:nth-child(2) { flex:1; }.focus b,.focus small{display:block}.focus small{color:var(--muted);font-size:12px;margin-top:3px}.play {border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 13px;font-weight:900}
  </style>
</head>
<body><main class="phone"><header class="top"><div><div class="eyebrow">SKYLINE</div><h1>오늘, 가볍게 시작해요.</h1></div><button class="switch" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light'">☼ / ☾</button></header><section class="hero"><small>9월 12일 · 금요일</small><h2>목표까지<br>한 걸음 더.</h2><p>작은 루틴이 큰 변화를 만들어요.</p><div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></section><section class="stats"><div class="stat"><b>3</b><span>완료한 일</span></div><div class="stat"><b>71m</b><span>집중 시간</span></div><div class="stat"><b>🔥 5</b><span>연속 기록</span></div></section><div class="section"><b>오늘의 할 일</b><span>전체 보기</span></div><div class="task"><i class="dot"></i><div><b>포트폴리오 문장 다듬기</b><small>예상 30분</small></div><span class="tag">중요</span></div><div class="task"><i class="dot"></i><div><b>채용 공고 3개 확인</b><small>오전 루틴</small></div><span class="tag">루틴</span></div><section class="focus"><i class="ring"></i><div><b>다음 집중 세션</b><small>25분 · 포트폴리오</small></div><button class="play">시작</button></section></main></body>
</html>
