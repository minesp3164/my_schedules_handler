<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>01 — Horizon AI 스타일</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#f5f7fe;color:#2b3674;font:15px 'DM Sans',sans-serif}.app{display:flex;min-height:100vh}.side{width:244px;padding:36px 20px;background:white}.logo{font-size:23px;font-weight:700}.logo b{color:#4318ff}.side h5{margin:48px 12px 13px;color:#a3aed0}.side a{display:block;padding:13px 12px;margin:3px 0;border-radius:8px;font-weight:700;color:#a3aed0}.side a.on{color:#4318ff;background:#f2f0ff}.main{flex:1;padding:31px 44px}.top{display:flex;justify-content:space-between;align-items:center}.search{padding:13px 20px;border:0;border-radius:30px;background:white;color:#a3aed0}.avatar{display:flex;gap:12px;align-items:center}.dot{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ffd4b3,#6e5aff)}h1{font-size:34px;margin:35px 0 6px}.muted{color:#a3aed0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:30px 0}.card{background:#fff;border-radius:18px;padding:21px;box-shadow:0 8px 18px #7090b214}.label{color:#a3aed0}.big{font-size:25px;font-weight:700;margin-top:8px}.up{color:#05cd99;font-size:13px}.layout{display:grid;grid-template-columns:1.4fr .8fr;gap:20px}.task{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #f1f2f7}.check{width:22px;height:22px;border:2px solid #4318ff;border-radius:7px}.done .check{background:#4318ff;position:relative}.done .check:after{content:'✓';color:#fff;position:absolute;left:3px;top:-2px}.task b{margin-left:auto;color:#4318ff}.circle{width:170px;height:170px;margin:25px auto;background:conic-gradient(#4318ff 0 65%,#e9e7ff 65%);border-radius:50%;padding:15px}.circle div{height:100%;display:grid;place-items:center;background:white;border-radius:50%;font-size:30px;font-weight:700}@media(max-width:750px){.side{display:none}.main{padding:22px}.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="logo">Reward<b>AI</b></div><h5>MENU</h5><a class="on">⌂ 오늘</a><a>◷ 집중</a><a>▥ 기록</a><a>✦ 리워드</a><h5>ACCOUNT</h5><a>⚙ 설정</a></aside><main class="main"><header class="top"><div class="search">⌕ &nbsp; 무엇을 할까요?</div><div class="avatar"><span class="muted">금요일, 9월 11일</span><i class="dot"></i></div></header><h1>좋은 아침이에요, Mina ✨</h1><p class="muted">한 번의 집중이 오늘을 바꿔요.</p><section class="stats"><div class="card"><span class="label">오늘 포인트</span><div class="big">65점</div><small class="up">↗ 35점 남음</small></div><div class="card"><span class="label">집중 시간</span><div class="big">25분</div><small class="up">↗ 세션 1회</small></div><div class="card"><span class="label">연속 기록</span><div class="big">4일 🔥</div><small class="muted">누적 18일</small></div><div class="card"><span class="label">주간 목표</span><div class="big">245점</div><small class="up">↗ 82% 달성</small></div></section><section class="layout"><div class="card"><h2>오늘의 할 일</h2><div class="task done"><i class="check"></i><span>집중 세션 25분</span><b>+10</b></div><div class="task done"><i class="check"></i><span>알고리즘 1문제</span><b>+15</b></div><div class="task"><i class="check"></i><span>이력서 한 문단 개선</span><b>+20</b></div><div class="task"><i class="check"></i><span>실제 지원 1건</span><b>+25</b></div></div><div class="card" style="text-align:center"><span class="label">오늘의 보상까지</span><div class="circle"><div>65%</div></div><b>게임 1시간 🎮</b><p class="muted">35점만 더 모아봐요</p></div></section></main></div></body></html>
