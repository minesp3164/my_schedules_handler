<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>02 — TaskFlow 스타일</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;600;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#e9e8e3;color:#171817;font:15px Manrope,sans-serif}.shell{max-width:1210px;margin:auto;padding:26px}.nav{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #b7b7ae;padding-bottom:22px}.logo{font:20px 'DM Mono';letter-spacing:-2px}.nav span{margin-left:26px;color:#5c5856}.nav b{background:#dd3c00;color:white;border-radius:99px;padding:10px 16px}h1{font-size:64px;line-height:1;margin:70px 0 14px;letter-spacing:-5px}.intro{font-size:18px;color:#5c5856;max-width:450px}.dashboard{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:48px}.panel{padding:27px;border:1px solid #171817;border-radius:4px;background:#f8f8f5}.label{font:12px 'DM Mono';color:#5c5856}.timer{background:#050607;color:#ededec;min-height:425px;position:relative}.timer .tag{color:#dd3c00}.time{font:clamp(70px,11vw,145px) 'DM Mono';margin-top:75px;letter-spacing:-10px}.start{position:absolute;bottom:27px;right:27px;border:0;border-radius:50%;width:70px;height:70px;background:#dd3c00;color:white;font-size:23px}.week{display:flex;gap:9px;align-items:end;height:165px;padding-top:25px;border-bottom:1px solid #b7b7ae}.week i{display:block;background:#78886e;width:100%;min-height:18px}.week i.today{background:#dd3c00}.check{display:flex;padding:18px 0;border-bottom:1px solid #d5d5cd;gap:13px;align-items:center}.check i{border:1px solid #171817;border-radius:50%;width:19px;height:19px}.check.done i{background:#78886e;box-shadow:inset 0 0 0 4px #f8f8f5}.points{margin-left:auto;font:14px 'DM Mono';color:#a62f01}@media(max-width:700px){h1{font-size:45px;letter-spacing:-3px;margin-top:45px}.nav span{display:none}.dashboard{grid-template-columns:1fr}.shell{padding:18px}}</style></head><body><main class="shell"><header class="nav"><div class="logo">REWARD//TRACKER</div><div><span>Today</span><span>Archive</span><span>Settings</span><b>65 PTS</b></div></header><h1>Make it count.<br>Then take the reward.</h1><p class="intro">오늘의 한 가지를 골라, 시간을 정하고, 끝까지 가보세요.</p><section class="dashboard"><article class="panel timer"><span class="label tag">FOCUS_MODE / 01</span><p style="font-size:21px;margin-top:25px">포트폴리오 한 화면 다듬기</p><div class="time">15:32</div><span class="label">25:00 중 · +10 PTS ON COMPLETE</span><button class="start">Ⅱ</button></article><article class="panel"><span class="label">THIS_WEEK / 245 PTS</span><div class="week"><i style="height:35%"></i><i style="height:53%"></i><i style="height:18%"></i><i style="height:65%"></i><i style="height:45%"></i><i style="height:25%"></i><i class="today" style="height:58%"></i></div><p class="label" style="margin-top:10px">SAT　 SUN　 MON　 TUE　 WED　 THU　 FRI</p><h2 style="margin-top:42px">TODAY'S LIST</h2><div class="check done"><i></i>집중 세션 25분 <b class="points">+10</b></div><div class="check done"><i></i>알고리즘 1문제 <b class="points">+15</b></div><div class="check"><i></i>실제 지원 1건 <b class="points">+25</b></div></article></section></main></body></html>
