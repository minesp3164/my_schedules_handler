<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>04 — AI Assistant 스타일</title><style>@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#11111b;color:#f4f2ff;font:14px 'Plus Jakarta Sans',sans-serif}.phone{max-width:430px;min-height:100vh;margin:auto;background:radial-gradient(circle at 90% 0,#4f2b9a55,transparent 32%),#171526;padding:23px 19px}.top{display:flex;justify-content:space-between;align-items:center}.bot{width:39px;height:39px;border-radius:13px;background:linear-gradient(135deg,#ad82ff,#7153ff);display:grid;place-items:center;font-size:19px}.icon{width:39px;height:39px;border-radius:50%;background:#27243b;display:grid;place-items:center}.greet{margin:36px 0 24px}.greet h1{font-size:29px;letter-spacing:-1.5px;margin:6px 0}.muted{color:#aaa6c2}.suggest{padding:17px;border:1px solid #403a62;border-radius:17px;background:#211e35;margin:10px 0}.suggest b{display:block;margin-bottom:5px}.orbs{display:flex;gap:8px;margin-top:25px}.orbs i{width:40px;height:40px;border-radius:50%;background:#5530b8;filter:blur(2px)}.orbs i:nth-child(2){background:#ff7a86}.orbs i:nth-child(3){background:#3dcdbe}.card{margin-top:23px;padding:19px;border-radius:20px;background:linear-gradient(120deg,#39226b,#262143);border:1px solid #5c4197}.card h2{font-size:17px;margin:0}.ring{width:135px;height:135px;margin:25px auto 15px;border-radius:50%;background:conic-gradient(#b58cff 0 65%,#50406f 65%);padding:12px}.ring div{height:100%;display:grid;place-items:center;text-align:center;border-radius:50%;background:#282040;font-size:29px;font-weight:700}.ring small{font-size:11px;color:#c6bddd}.action{display:block;width:100%;border:0;border-radius:14px;background:#b58cff;color:#241743;padding:14px;font-weight:700}.chat{display:flex;gap:9px;margin-top:22px;padding:14px 15px;border-radius:15px;background:#28243a;color:#aaa6c2}.nav{display:flex;justify-content:space-around;margin-top:30px;color:#aaa6c2}.nav b{color:#b58cff}.spark{color:#d6b5ff;font-size:12px;letter-spacing:1px}</style></head><body><main class="phone"><header class="top"><div class="bot">✦</div><span class="spark">FOCUS COMPANION</span><span class="icon">⋮</span></header><section class="greet"><small class="muted">금요일, 9월 11일</small><h1>오늘의 첫 5분,<br>함께 시작할까요?</h1><p class="muted">리워드 AI가 지금 할 수 있는 가장 작은 일을 골라드려요.</p></section><article class="suggest"><b>✦ AI의 제안</b><span class="muted">포트폴리오를 열고, 한 문장만 고쳐보세요. 25분 타이머를 준비했어요.</span></article><div class="orbs"><i></i><i></i><i></i><span class="muted" style="padding:12px 0 0 4px">오늘의 에너지</span></div><article class="card"><h2>오늘의 보상 궤도</h2><p class="muted">게임 1시간까지 35점 남음</p><div class="ring"><div>65%<small>65 / 100점</small></div></div><button class="action">▶ 25분 집중 시작 · +10점</button></article><div class="chat">✦　무엇부터 할지 모르겠다면 말해보세요…</div><footer class="nav"><span>⌂<br>홈</span><span>◷<br>집중</span><b>✦<br>AI</b><span>▥<br>기록</span></footer></main></body></html>
